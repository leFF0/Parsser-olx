<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Deals</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#fff);--bg2:var(--tg-theme-secondary-bg-color,#f1f2f5);
  --tx:var(--tg-theme-text-color,#111);--hint:var(--tg-theme-hint-color,#7a7f87);
  --acc:var(--tg-theme-button-color,#2481cc);--acct:var(--tg-theme-button-text-color,#fff);
  --warn:#e5484d;--ok:#2fa24f;--r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg2);color:var(--tx);font:15px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 12px 8px;border-bottom:1px solid color-mix(in srgb,var(--hint) 20%,transparent)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;padding:7px 13px;border-radius:99px;background:var(--bg2);color:var(--tx);border:0;font:inherit;font-size:14px}
.chip.on{background:var(--acc);color:var(--acct)}
.list{padding:10px 12px;display:grid;gap:12px}
.card{background:var(--bg);border-radius:var(--r);overflow:hidden}
.ph{position:relative;aspect-ratio:4/3;background:var(--bg2) center/cover no-repeat}
.price{position:absolute;left:10px;bottom:10px;background:var(--bg);color:var(--tx);font-weight:800;font-size:22px;letter-spacing:-.02em;padding:3px 11px;border-radius:10px;font-variant-numeric:tabular-nums}
.heart{position:absolute;right:10px;top:10px;width:38px;height:38px;border-radius:50%;border:0;background:color-mix(in srgb,var(--bg) 88%,transparent);font-size:19px;color:var(--hint)}
.heart.on{color:var(--warn)}
.sus{position:absolute;left:10px;top:10px;background:var(--warn);color:#fff;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px}
.bd{padding:11px 13px 13px}
.t{font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.m{color:var(--hint);font-size:13px;margin-top:4px}
.btn{display:block;width:100%;margin-top:10px;padding:11px;border:0;border-radius:12px;background:var(--acc);color:var(--acct);font:inherit;font-weight:600;text-align:center;text-decoration:none}
.btn.sec{background:var(--bg2);color:var(--tx)}
.btn.del{color:var(--warn)}
.empty{text-align:center;color:var(--hint);padding:60px 24px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg);padding-bottom:env(safe-area-inset-bottom);border-top:1px solid color-mix(in srgb,var(--hint) 20%,transparent)}
.nav button{flex:1;border:0;background:none;padding:10px 0 9px;color:var(--hint);font:inherit;font-size:12px}
.nav button b{display:block;font-size:20px;font-weight:400}
.nav button.on{color:var(--acc)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.scard{background:var(--bg);border-radius:var(--r);padding:13px 14px}
.scard h3{margin:0;font-size:16px}
.sw{width:46px;height:28px;border-radius:99px;background:var(--hint);position:relative;flex:none;border:0;opacity:.5}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--ok);opacity:1}.sw.on::after{left:21px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none;align-items:flex-end}
.sheet.show{display:flex}
.sh{background:var(--bg);width:100%;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom))}
label{display:block;font-size:13px;color:var(--hint);margin:12px 0 5px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid color-mix(in srgb,var(--hint) 35%,transparent);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:64px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pad{padding:12px}
.more{margin:4px 12px 14px}
</style>
</head>
<body>
<div class="top" id="top"></div>
<div id="view"></div>
<nav class="nav" id="nav"></nav>
<div class="sheet" id="sheet"><div class="sh" id="sh"></div></div>

<script>
const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
const I18N = {
 uk:{feed:"Стрічка",fav:"Обране",searches:"Пошуки",settings:"Налаштування",all:"Усі",newest:"Нові",cheap:"Дешеві",
  empty:"Поки порожньо. Нові знахідки з'являться тут після наступної перевірки.",emptyFav:"Натисни ♥ на оголошенні, щоб зберегти.",
  open:"Відкрити оголошення",more:"Показати ще",sus:"Підозріло",add:"+ Новий пошук",edit:"Редагувати",
  name:"Назва",kw:"Що шукати (через кому: iphone 11, thinkpad t480)",stop:"Стоп-слова (через кому)",must:"Обов'язкові слова",
  min:"Ціна від, грн",max:"Ціна до, грн",disc:"Дешевше за медіану на, % (0 = вимк.)",city:"Місто або область",
  cond:"Стан",any:"Будь-який",new:"Новий",used:"Б/в",hide:"Ховати підозрілі",on:"Увімкнено",save:"Зберегти",del:"Видалити",cancel:"Скасувати",
  found:"знайдено",notify:"Сповіщення",qf:"Тихі години: з",qt:"до",lim:"Ліміт сповіщень на день",tz:"Часовий пояс (UTC+)",lang:"Мова",
  saved:"Збережено",sites:"Сайти (olx)",noSearch:"Немає пошуків. Додай перший."},
 ru:{feed:"Лента",fav:"Избранное",searches:"Поиски",settings:"Настройки",all:"Все",newest:"Новые",cheap:"Дешёвые",
  empty:"Пока пусто. Новые находки появятся здесь после следующей проверки.",emptyFav:"Нажми ♥ на объявлении, чтобы сохранить.",
  open:"Открыть объявление",more:"Показать ещё",sus:"Подозрительно",add:"+ Новый поиск",edit:"Редактировать",
  name:"Название",kw:"Что искать (через запятую: iphone 11, thinkpad t480)",stop:"Стоп-слова (через запятую)",must:"Обязательные слова",
  min:"Цена от, грн",max:"Цена до, грн",disc:"Дешевле медианы на, % (0 = выкл.)",city:"Город или область",
  cond:"Состояние",any:"Любое",new:"Новое",used:"Б/у",hide:"Скрывать подозрительные",on:"Включён",save:"Сохранить",del:"Удалить",cancel:"Отмена",
  found:"найдено",notify:"Уведомления",qf:"Тихие часы: с",qt:"до",lim:"Лимит уведомлений в день",tz:"Часовой пояс (UTC+)",lang:"Язык",
  saved:"Сохранено",sites:"Сайты (olx)",noSearch:"Нет поисков. Добавь первый."}
};
let L = "uk", S = {}, state = {tab:"feed", sort:"new", search:"", offset:0, user:null, searches:[]};
const t = k => I18N[L][k] || k;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = p => Math.round(p).toString().replace(/\B(?=(\d{3})+(?!\d))/g, "\u00a0") + "\u00a0₴";

async function api(path, opt = {}) {
  const r = await fetch("/api" + path, {...opt, headers: {"X-Init-Data": tg.initData, "Content-Type": "application/json"}});
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
const post = (p, b) => api(p, {method: "POST", body: JSON.stringify(b)});

function nav() {
  const items = [["feed","🔥"],["fav","♥"],["searches","🔎"],["settings","⚙️"]];
  $("nav").innerHTML = items.map(([k,i]) => `<button class="${state.tab===k?"on":""}" onclick="go('${k}')"><b>${i}</b>${t(k)}</button>`).join("");
}
function go(tab) { state.tab = tab; state.offset = 0; render(); }

async function render() {
  nav();
  const top = $("top"), view = $("view");
  top.style.display = "none";
  if (state.tab === "feed" || state.tab === "fav") { await renderFeed(true); }
  else if (state.tab === "searches") { await renderSearches(); }
  else { renderSettings(); }
}

async function renderFeed(reset) {
  const top = $("top"), view = $("view");
  if (state.tab === "feed") {
    top.style.display = "block";
    const sc = state.searches.map(s => `<button class="chip ${state.search==s.id?"on":""}" onclick="setSearch('${s.id}')">${esc(s.name)}</button>`).join("");
    top.innerHTML = `<div class="chips">
      <button class="chip ${state.sort==="new"?"on":""}" onclick="setSort('new')">${t("newest")}</button>
      <button class="chip ${state.sort==="cheap"?"on":""}" onclick="setSort('cheap')">${t("cheap")}</button>
      <button class="chip ${!state.search?"on":""}" onclick="setSearch('')">${t("all")}</button>${sc}</div>`;
  }
  const qs = new URLSearchParams({tab: state.tab==="fav"?"fav":"all", sort: state.sort, search: state.search, offset: state.offset});
  let rows = [];
  try { rows = await api("/feed?" + qs); } catch (e) { view.innerHTML = `<div class="empty">Error</div>`; return; }
  const cards = rows.map(card).join("");
  if (reset) {
    view.innerHTML = rows.length ? `<div class="list" id="list">${cards}</div>` : `<div class="empty">${state.tab==="fav"?t("emptyFav"):t("empty")}</div>`;
  } else { $("list").insertAdjacentHTML("beforeend", cards); }
  const old = $("more"); if (old) old.remove();
  if (rows.length === 20) view.insertAdjacentHTML("beforeend", `<button class="btn sec more" id="more" onclick="more()">${t("more")}</button>`);
}
function card(a) {
  const meta = [a.city, a.created ? new Date(a.created).toLocaleDateString(L==="uk"?"uk-UA":"ru-RU",{day:"numeric",month:"short"}) : ""].filter(Boolean).join(" · ");
  return `<div class="card"><div class="ph" style="${a.photo?`background-image:url('${esc(a.photo)}')`:""}">
    ${a.sus>=50?`<span class="sus">⚠ ${t("sus")}</span>`:""}
    <button class="heart ${a.fav?"on":""}" onclick="fav(this,'${esc(a.id)}')">${a.fav?"♥":"♡"}</button>
    <span class="price">${money(a.price)}</span></div>
    <div class="bd"><div class="t">${esc(a.title)}</div><div class="m">${esc(meta)}</div>
    <a class="btn" href="${esc(a.url)}" onclick="tg.openLink('${esc(a.url)}');return false">${t("open")}</a></div></div>`;
}
function setSort(s) { state.sort = s; state.offset = 0; renderFeed(true); }
function setSearch(s) { state.search = s; state.offset = 0; renderFeed(true); }
function more() { state.offset += 20; renderFeed(false); }
async function fav(el, id) {
  const r = await post("/fav", {ad_id: id});
  el.classList.toggle("on", r.fav); el.textContent = r.fav ? "♥" : "♡";
  tg.HapticFeedback && tg.HapticFeedback.impactOccurred("light");
  if (state.tab === "fav" && !r.fav) el.closest(".card").remove();
}

async function loadSearches() { state.searches = await api("/searches"); }
async function renderSearches() {
  await loadSearches();
  const v = $("view");
  const items = state.searches.map(s => `<div class="scard"><div class="row"><div><h3>${esc(s.name)}</h3>
    <div class="m">${s.max_price?"≤ "+money(s.max_price)+" · ":""}${s.count} ${t("found")}</div></div>
    <button class="sw ${s.active?"on":""}" onclick="toggleSearch(${s.id})"></button></div>
    <div class="m" style="margin-top:6px">${esc(s.keywords)}</div>
    <button class="btn sec" onclick="editSearch(${s.id})">${t("edit")}</button></div>`).join("");
  v.innerHTML = `<div class="list">${items || `<div class="empty">${t("noSearch")}</div>`}
    <button class="btn" onclick="editSearch(0)">${t("add")}</button></div>`;
}
async function toggleSearch(id) {
  const s = state.searches.find(x => x.id === id);
  await post("/searches", {...s, active: !s.active});
  renderSearches();
}
function editSearch(id) {
  const s = state.searches.find(x => x.id === id) || {name:"", keywords:"", stop_words:"", must_words:"", min_price:0, max_price:0, discount:0, city:"", sites:"olx", condition:"any", active:1, hide_sus:0};
  $("sh").innerHTML = `
   <label>${t("name")}</label><input id="f_name" value="${esc(s.name)}">
   <label>${t("kw")}</label><textarea id="f_kw">${esc(s.keywords)}</textarea>
   <div class="two"><div><label>${t("min")}</label><input id="f_min" type="number" inputmode="numeric" value="${s.min_price||""}"></div>
   <div><label>${t("max")}</label><input id="f_max" type="number" inputmode="numeric" value="${s.max_price||""}"></div></div>
   <label>${t("disc")}</label><input id="f_disc" type="number" inputmode="numeric" value="${s.discount||""}">
   <label>${t("city")}</label><input id="f_city" value="${esc(s.city)}">
   <label>${t("stop")}</label><input id="f_stop" value="${esc(s.stop_words)}">
   <label>${t("must")}</label><input id="f_must" value="${esc(s.must_words)}">
   <div class="two"><div><label>${t("cond")}</label><select id="f_cond">
     ${["any","new","used"].map(c=>`<option value="${c}" ${s.condition===c?"selected":""}>${t(c)}</option>`).join("")}</select></div>
   <div><label>${t("sites")}</label><input id="f_sites" value="${esc(s.sites)}"></div></div>
   <div class="row" style="margin-top:14px"><span>${t("hide")}</span><button class="sw ${s.hide_sus?"on":""}" id="f_hide" onclick="this.classList.toggle('on')"></button></div>
   <button class="btn" onclick="saveSearch(${id})">${t("save")}</button>
   ${id?`<button class="btn sec del" onclick="delSearch(${id})">${t("del")}</button>`:""}
   <button class="btn sec" onclick="closeSheet()">${t("cancel")}</button>`;
  $("sheet").classList.add("show");
}
function closeSheet() { $("sheet").classList.remove("show"); }
$("sheet").addEventListener("click", e => { if (e.target.id === "sheet") closeSheet(); });
async function saveSearch(id) {
  const s = state.searches.find(x => x.id === id);
  await post("/searches", {id: id||undefined, active: s ? s.active : 1, name: $("f_name").value, keywords: $("f_kw").value,
    min_price: $("f_min").value, max_price: $("f_max").value, discount: $("f_disc").value, city: $("f_city").value,
    stop_words: $("f_stop").value, must_words: $("f_must").value, condition: $("f_cond").value,
    sites: $("f_sites").value || "olx", hide_sus: $("f_hide").classList.contains("on")});
  closeSheet(); await renderSearches(); tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success");
}
async function delSearch(id) { await api("/searches/" + id, {method: "DELETE"}); closeSheet(); renderSearches(); }

function renderSettings() {
  const u = state.user;
  $("view").innerHTML = `<div class="list"><div class="scard">
   <div class="row"><span>${t("notify")}</span><button class="sw ${u.notify?"on":""}" id="s_notify" onclick="this.classList.toggle('on')"></button></div>
   <label>${t("qf")}</label><div class="two"><input id="s_qf" type="number" min="0" max="23" value="${u.quiet_from}"><input id="s_qt" type="number" min="0" max="23" value="${u.quiet_to}"></div>
   <label>${t("lim")}</label><input id="s_lim" type="number" value="${u.daily_limit}">
   <label>${t("tz")}</label><input id="s_tz" type="number" value="${u.tz}">
   <label>${t("lang")}</label><select id="s_lang"><option value="uk" ${u.lang==="uk"?"selected":""}>Українська</option><option value="ru" ${u.lang==="ru"?"selected":""}>Русский</option></select>
   <button class="btn" onclick="saveSettings()">${t("save")}</button></div></div>`;
}
async function saveSettings() {
  const u = {lang: $("s_lang").value, notify: $("s_notify").classList.contains("on"), quiet_from: $("s_qf").value,
    quiet_to: $("s_qt").value, daily_limit: $("s_lim").value, tz: $("s_tz").value};
  await post("/settings", u);
  Object.assign(state.user, u, {notify: u.notify ? 1 : 0}); L = u.lang;
  tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success");
  render();
}

(async () => {
  try {
    const me = await api("/me"); state.user = me.user; L = me.user.lang || "uk";
    await loadSearches();
  } catch (e) { $("view").innerHTML = `<div class="empty">Відкрий цей додаток із Telegram-бота.</div>`; return; }
  render();
})();
</script>
</body>
</html>
